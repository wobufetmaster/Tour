    document.body.append(h('div', { class: 'overlay', onclick: hideOverlays },
      h('div', { class: 'box', onclick: e => e.stopPropagation() },
        h('h2', null, 'Flag stop ' + (S.i + 1)),
        h('div', { class: 'mono muted', style: 'margin-bottom:10px' }, locOf(st)),
        input,
        h('p', { class: 'muted', style: 'margin:10px 0 0' }, 'Enter saves it into the review file. Esc cancels.'))));
    input.focus();
  }
  async function submitFlag(text) {
    text = text.trim();
    const st = cur();
    hideOverlays();
    if (!text || !st) return;
    try {
      S.review = await api('POST', '/api/review/' + encodeURIComponent(id) + '/flag', { stop_id: st.id, text });
      toast('Flagged stop ' + (S.i + 1));
    } catch (e) { toast('Flag failed: ' + e.message); }
    renderNote(); renderStops();
  }

  function onKey(e) {
    if (!S.review) return;
    if (S.flag !== null) return;  // the flag input handles its own keys
    if (S.help) { e.preventDefault(); hideOverlays(); return; }
    if (S.chooser) { if (e.key === 'Escape') { e.preventDefault(); hideOverlays(); } return; }
    if (S.goto !== null) {
      e.preventDefault();
      if (/^\d$/.test(e.key)) S.goto += e.key;
      else if (e.key === 'Backspace') S.goto = S.goto.slice(0, -1);
      else if (e.key === 'Enter') { const n = parseInt(S.goto, 10); S.goto = null; if (n >= 1) go(n - 1); }
      else if (e.key === 'Escape') S.goto = null;
      paintGoto();
      return;
    }
    if (isTyping(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === ' ' || k === 'ArrowRight' || k === 'j' || k === 'PageDown') { e.preventDefault(); go(S.i + 1); }
    else if (k === 'ArrowLeft' || k === 'k' || k === 'PageUp') { e.preventDefault(); go(S.i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(stops().length - 1); }
    else if (k === 'f') { e.preventDefault(); setMode(S.mode === 'full' ? 'stop' : 'full'); }
    else if (k === 'd') { e.preventDefault(); setMode(S.mode === 'diff' ? 'stop' : 'diff'); }
    else if (k === 'Escape') { e.preventDefault(); setMode('stop'); }
    else if (k === 'm') { e.preventDefault(); setMode(S.mode === 'expand' ? 'stop' : 'expand'); }
    else if (k === 'g') { e.preventDefault(); S.goto = ''; paintGoto(); }
    else if (k === 'x') { e.preventDefault(); openFlag(); }
    else if (k === '?') { e.preventDefault(); showHelp(); }
    else if (k === '+' || k === '=') { e.preventDefault(); setFont(1); }
    else if (k === '-' || k === '_') { e.preventDefault(); setFont(-1); }
    else if (k === 't') { e.preventDefault(); toggleTheme(); }
  }

  (async () => {
    try {
      S.review = await api('GET', '/api/review/' + encodeURIComponent(id));
    } catch (e) { showError(e); return; }
    document.title = (presenter ? '🎤 ' : '') + S.review.title + ' · Tour';
    els.loc = h('span', { class: 'loc mono' });
    els.pos = h('span', { class: 'pos' });
    els.modeEl = h('span', { class: 'mode' });
    els.sync = h('span', null, presenter ? '○ no projector yet' : '○ standalone');
    els.code = h('div', { class: 'walk-code can-peek' });
    els.code.addEventListener('click', e => {
      if (window.getSelection && String(window.getSelection()).length) return;
      const name = wordAtPoint(e.clientX, e.clientY);
      if (!name) return;
      const from = S.mode === 'peek' && S.peek ? S.peek.file : (cur() ? cur().file : null);
      jumpToDefinition(name, from, d => peekAt(name, d), { onOpen: () => { S.chooser = true; }, onClose: () => { S.chooser = false; } });
    });
    els.note = h('div', { class: 'walk-note' });
    els.stops = h('ul', { class: 'stop-list' });
    const body = presenter
      ? h('div', { class: 'walk-body present' }, h('div', { class: 'sidebar' }, h('h3', null, 'Stops'), els.stops), els.code, els.note)
      : h('div', { class: 'walk-body' }, els.code, els.note);
    app.append(h('div', { class: 'ide walk' },
      h('div', { class: 'titlebar' },
        h('span', { class: 'brand' }, 'Tour'), h('span', { class: 'sep' }, '›'),
        h('span', { class: 'title', style: 'min-width:0' }, S.review.title || id),
        presenter ? h('span', { class: 'badge question' }, 'presenter') : null,
        h('span', { class: 'grow' }),
        presenter ? h('a', { href: '#walk/' + encodeURIComponent(id), target: '_blank' }, h('button', { class: 'small' }, '▶ open projector tab')) : null,
        presenter ? h('a', { href: '#author/' + encodeURIComponent(id) }, h('button', { class: 'small ghost' }, 'edit')) : null,
        themeBtn()),
      body,
      h('div', { class: 'statusbar' },
        els.loc, els.modeEl, els.sync,
        h('span', { class: 'right' }, els.pos, h('span', null, h('kbd', null, '?'), ' keys')))));
    S.i = Math.max(0, Math.min(stops().length - 1, startIndex || 0));
    renderAll();
    if (presenter) { pushState(); S.beatTimer = setInterval(pushState, 2000); }
    else { poll(); S.pollTimer = setInterval(poll, 500); }
  })();

  return {
    onKey,
    destroy() { hideOverlays(); clearInterval(S.pollTimer); clearInterval(S.beatTimer); },
  };
}

route();
</script>
</body>
</html>
