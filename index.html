<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour</title>
<script>
(function () { var t = null; try { t = localStorage.getItem('tour.theme'); } catch (e) {}
  document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();
</script>
<style>
:root, :root[data-theme=light] {
  --bg: #ffffff; --chrome: #f3f3f3; --chrome2: #ececec; --title: #e4e4e4; --border: #d8d8d8; --fg: #1f1f1f; --muted: #6f6f6f;
  --accent: #005fb8; --accent-fg: #ffffff; --accent-bg: #e5efff; --status: #005fb8; --status-fg: #ffffff;
  --hover: #e6e6e6; --active: #d5e4fa; --input: #ffffff; --input-border: #c8c8c8;
  --gut-fg: #237893; --gut-bg: #fafafa; --dim: #9a9a9a;
  --add-bg: #e6ffec; --add-gut: #c9f2d3; --del-bg: #ffebe9; --del-gut: #ffd0cc; --empty: #f4f4f4;
  --sel-bg: #fff3bf; --sel-gut: #f1cf5a; --sel-gut-fg: #4a3800; --stop-bg: #dfeaff; --hunk-bg: #eef3fb; --hunk-fg: #57606a;
  --in-bg: #fff8dc; --in-bar: #e5a100; --shadow: rgba(0,0,0,.25);
  --kw: #0000ff; --ctrl: #af00db; --type: #267f99; --string: #a31515; --comment: #008000; --number: #098658; --fn: #795e26; --pp: #af00db; --dec: #795e26;
  --badge-change: #dbe9ff; --badge-change-fg: #0b4dac; --badge-context: #e4e4e4; --badge-context-fg: #444444; --badge-question: #fff1b8; --badge-question-fg: #7a4b00;
  --err-bg: #ffebe9; --err-fg: #a40e26; --note-code: #f0f0f0;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --code-size: 13px;
  color-scheme: light;
}
:root[data-theme=dark] {
  --bg: #1e1e1e; --chrome: #252526; --chrome2: #2d2d2d; --title: #3c3c3c; --border: #3a3a3a; --fg: #d4d4d4; --muted: #9a9a9a;
  --accent: #0078d4; --accent-fg: #ffffff; --accent-bg: #163b5c; --status: #007acc; --status-fg: #ffffff;
  --hover: #2a2d2e; --active: #04395e; --input: #3c3c3c; --input-border: #4a4a4a;
  --gut-fg: #6e7681; --gut-bg: #1e1e1e; --dim: #6b6b6b;
  --add-bg: #1c3a25; --add-gut: #17482a; --del-bg: #4a1f24; --del-gut: #5c2129; --empty: #232323;
  --sel-bg: #4b4420; --sel-gut: #7a6a1f; --sel-gut-fg: #ffe9a0; --stop-bg: #1f3550; --hunk-bg: #2a2f3a; --hunk-fg: #9aa4b2;
  --in-bg: #2c2a1c; --in-bar: #e5a100; --shadow: rgba(0,0,0,.6);
  --kw: #569cd6; --ctrl: #c586c0; --type: #4ec9b0; --string: #ce9178; --comment: #6a9955; --number: #b5cea8; --fn: #dcdcaa; --pp: #c586c0; --dec: #dcdcaa;
  --badge-change: #1f3550; --badge-change-fg: #8cb8ff; --badge-context: #3a3a3a; --badge-context-fg: #c8c8c8; --badge-question: #4b4420; --badge-question-fg: #ffd66b;
  --err-bg: #4a1f24; --err-fg: #ff9a9a; --note-code: #2d2d2d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 var(--sans); color: var(--fg); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--input); border: 1px solid var(--input-border); border-radius: 3px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.1); }
button.danger { color: var(--err-fg); }
button.small { padding: 1px 7px; font-size: 12px; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { background: var(--hover); color: var(--fg); }
input[type=text], select, textarea { border: 1px solid var(--input-border); border-radius: 3px; padding: 4px 8px; background: var(--input); }
input[type=text]:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
textarea { width: 100%; resize: vertical; }
label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .05em; }
kbd { font: 11px var(--mono); background: var(--chrome2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; }
.muted { color: var(--muted); }
.error { background: var(--err-bg); color: var(--err-fg); border: 1px solid transparent; padding: 8px 12px; border-radius: 3px; margin: 12px; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: .05em; line-height: 16px; vertical-align: middle; }
.badge.change { background: var(--badge-change); color: var(--badge-change-fg); }
.badge.context { background: var(--badge-context); color: var(--badge-context-fg); }
.badge.question { background: var(--badge-question); color: var(--badge-question-fg); }
.mono { font-family: var(--mono); }
.sha { font-family: var(--mono); font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border: 3px solid transparent; background-clip: content-box; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* syntax tokens */
.t-kw { color: var(--kw); }
.t-ctrl { color: var(--ctrl); }
.t-type { color: var(--type); }
.t-string { color: var(--string); }
.t-comment { color: var(--comment); font-style: italic; }
.t-number { color: var(--number); }
.t-pp { color: var(--pp); }
.t-fn { color: var(--fn); }
.t-dec { color: var(--dec); }
.can-peek .t-id:hover, .can-peek .t-fn:hover, .can-peek .t-string:hover { text-decoration: underline; cursor: pointer; }
.overlay .box.peek { width: min(1100px, 92vw); max-width: none; display: flex; flex-direction: column; max-height: 88vh; padding: 0; overflow: hidden; }
.overlay .box.peek .peek-head { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.overlay .box.peek .walk-code { flex: 1; min-height: 200px; font-size: 13px; }
.overlay .box.peek .peek-foot { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.def-list { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow: auto; }
.def-list li { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 3px; cursor: pointer; }
.def-list li:hover { background: var(--hover); }
.def-list .f { font-family: var(--mono); font-size: 12px; }
.def-list .t { font-size: 11px; color: var(--muted); }
.badge.k { background: var(--badge-context); color: var(--badge-context-fg); text-transform: none; letter-spacing: 0; }
.badge.k.macro-generated { background: var(--badge-question); color: var(--badge-question-fg); }
.badge.tgt { background: var(--accent-bg); color: var(--accent); text-transform: none; letter-spacing: 0; font-family: var(--mono); }
.index-card .errs { font-family: var(--mono); font-size: 12px; color: var(--err-fg); white-space: pre-wrap; margin-top: 8px; }

/* ---------- IDE frame: title bar / body / status bar ---------- */
.ide { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; background: var(--bg); }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 36px; background: var(--title); border-bottom: 1px solid var(--border); font-size: 13px; }
.titlebar .brand { font-weight: 600; letter-spacing: .02em; }
.titlebar .sep { color: var(--muted); }
.titlebar .title { font-weight: 600; font-size: 13px; border: 1px solid transparent; border-radius: 3px; padding: 2px 6px; min-width: 220px; background: transparent; }
.titlebar .title:hover, .titlebar .title:focus { border-color: var(--input-border); background: var(--input); }
.statusbar { display: flex; align-items: center; gap: 18px; padding: 0 12px; height: 22px; background: var(--status); color: var(--status-fg); font-size: 12px; white-space: nowrap; overflow: hidden; }
.statusbar .right { margin-left: auto; display: flex; gap: 18px; }
.statusbar kbd { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); color: inherit; }
.statusbar .err { background: #c72e2e; margin: 0 -12px; padding: 0 12px; height: 100%; display: flex; align-items: center; }
.ide-body { display: grid; grid-template-columns: 240px 1fr 380px; min-height: 0; }
.sidebar { background: var(--chrome); border-right: 1px solid var(--border); overflow: auto; min-height: 0; }
.sidebar h3, .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 9px 14px 5px; font-weight: 600; }
.tree { list-style: none; margin: 0; padding: 0 0 12px; }
.tree li { display: flex; gap: 6px; align-items: baseline; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 22px; }
.tree li.dir { padding: 0 12px; color: var(--muted); font-size: 12px; cursor: default; }
.tree li.file { padding: 0 12px 0 28px; }
.tree li.file:hover { background: var(--hover); }
.tree li.file.active { background: var(--active); }
.tree .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree .n { font-size: 11px; color: var(--muted); }
.tree .st { font-size: 11px; font-weight: 700; width: 12px; text-align: center; }
.tree .st.added { color: #3fb950; } .tree .st.deleted { color: #f85149; } .tree .st.renamed { color: #d29922; } .tree .st.modified { color: #d29922; }
.editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.tabs { display: flex; align-items: stretch; background: var(--chrome2); border-bottom: 1px solid var(--border); height: 35px; }
.tab { padding: 0 14px; display: flex; align-items: center; gap: 8px; background: var(--bg); border-right: 1px solid var(--border); font-size: 13px; font-family: var(--mono); max-width: 60%; overflow: hidden; }
.tab .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .dim { color: var(--muted); }
.tabs .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; padding-right: 10px; font-size: 12px; color: var(--muted); }
.editor-scroll { flex: 1; overflow: auto; min-height: 0; }
.panel { background: var(--chrome); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.empty-msg { padding: 40px 20px; color: var(--muted); text-align: center; }

/* ---------- home ---------- */
.home { max-width: 880px; margin: 0 auto; padding: 32px 20px; }
.home h1 { font-size: 22px; margin: 0 0 4px; }
.card { background: var(--chrome); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin: 16px 0; }
.card h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.review-list { list-style: none; margin: 0; padding: 0; }
.review-list li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--border); }
.review-list li:first-child { border-top: 0; }
.review-list .t { font-weight: 600; flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-grid input, .form-grid select { width: 100%; }

/* ---------- diff table ---------- */
table.diff { border-collapse: collapse; width: 100%; font: var(--code-size)/1.5 var(--mono); table-layout: fixed; }
table.diff td { padding: 0 6px; vertical-align: top; white-space: pre-wrap; word-break: break-all; }
table.diff td.gut { width: 52px; text-align: right; color: var(--gut-fg); user-select: none; cursor: pointer; background: var(--gut-bg); }
table.diff td.gut:hover { background: var(--hover); color: var(--fg); }
table.diff tr.add td.code { background: var(--add-bg); }
table.diff tr.del td.code { background: var(--del-bg); }
table.diff tr.add td.gut { background: var(--add-gut); }
table.diff tr.del td.gut { background: var(--del-gut); }
table.diff td.code.add { background: var(--add-bg); }
table.diff td.code.del { background: var(--del-bg); }
table.diff td.code.empty { background: var(--empty); }
table.diff tr.hunk td { background: var(--hunk-bg); color: var(--hunk-fg); font-size: 11px; padding: 3px 8px; user-select: none; }
table.diff tr.sel td.code { background: var(--sel-bg) !important; }
table.diff tr.sel td.gut { background: var(--sel-gut) !important; color: var(--sel-gut-fg); }
table.diff tr.stop-range td.code { background: var(--stop-bg); }
table.diff tr.stop-range td.gut:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.diff .tag { display: inline-block; width: 1ch; color: var(--muted); user-select: none; }
table.diff tr.editor-row td { padding: 8px 12px; background: var(--chrome); border-top: 1px solid var(--sel-gut); border-bottom: 1px solid var(--sel-gut); white-space: normal; font: 13px var(--sans); }
.editor-row textarea { font-family: var(--sans); min-height: 60px; }

/* ---------- stops panel ---------- */
.stop-list { list-style: none; margin: 0; padding: 0 0 8px; flex: 1; overflow: auto; min-height: 80px; }
.stop-list li { padding: 5px 10px 5px 8px; cursor: pointer; display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: start; }
.stop-list li:hover { background: var(--hover); }
.stop-list li.active { background: var(--active); }
.stop-list li.dragging { opacity: .4; }
.stop-list .grip { color: var(--dim); cursor: grab; line-height: 1.3; }
.stop-list .loc { font-family: var(--mono); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.stop-list .loc .idx { color: var(--muted); min-width: 22px; }
.stop-list .loc .f { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop-list .note1 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop-list .note1.empty { font-style: italic; }
.stop-edit { border-top: 1px solid var(--border); padding: 10px 12px; display: grid; gap: 8px; }
.stop-edit .loc { font-family: var(--mono); font-size: 12px; }
.stop-edit textarea { font-family: var(--sans); }
.hint { font-size: 12px; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--border); }

/* ---------- walkthrough ---------- */
.walk-body { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
.walk-code { overflow: auto; padding: 12px 0; font-family: var(--mono); line-height: 1.5; background: var(--bg); }
.walk-code .ln { display: flex; white-space: pre-wrap; word-break: break-all; padding: 0 16px 0 0; }
.walk-code .ln .no { min-width: 6ch; flex: none; text-align: right; padding: 0 1.5ch 0 .5ch; color: var(--gut-fg); user-select: none; white-space: nowrap; }
.walk-code .ln .tag { width: 1.5ch; flex: none; color: var(--muted); user-select: none; }
.walk-code .ln.dim { opacity: .45; }
.walk-code.full .ln.dim { opacity: .8; }
.walk-code .ln.in { background: var(--in-bg); box-shadow: inset 4px 0 0 var(--in-bar); }
.walk-code .ln.add { background: var(--add-bg); }
.walk-code .ln.del { background: var(--del-bg); }
.walk-code .ln.add.in, .walk-code .ln.del.in { filter: saturate(1.3); }
.walk-code .hunk { color: var(--hunk-fg); background: var(--hunk-bg); padding: 2px 16px; margin: 6px 0; font-size: .85em; }
.walk-code .gap { text-align: center; color: var(--dim); padding: 4px; }
.walk-note { border-left: 1px solid var(--border); background: var(--chrome); overflow: auto; padding: 18px 22px; font-size: 17px; line-height: 1.5; }
.walk-note .badge { font-size: 12px; line-height: 20px; margin-bottom: 8px; }
.walk-note p { margin: 0 0 12px; }
.walk-note ul, .walk-note ol { margin: 0 0 12px; padding-left: 22px; }
.walk-note code { font-family: var(--mono); font-size: .9em; background: var(--note-code); padding: 1px 4px; border-radius: 3px; }
.walk-note pre { background: var(--note-code); padding: 8px 10px; border-radius: 3px; overflow: auto; font-size: .85em; }
.walk-note .flags { margin-top: 20px; border-top: 1px dashed var(--border); padding-top: 10px; font-size: 14px; }
.walk-note .flags li { margin: 4px 0; }
.walk-note .empty { color: var(--muted); font-style: italic; }
.walk-body.present { grid-template-columns: 260px 1fr 420px; }
.walk-body.present .stop-list { font-size: 13px; }
.walk-body.present .stop-list li { grid-template-columns: 12px 1fr; }
.walk-note h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.walk-note .private { border-top: 1px dashed var(--border); margin-top: 16px; font-size: 15px; }
.walk-note .upnext { font-size: 14px; }
.statusbar .live { color: #7ee787; }
@media (max-width: 1000px) {
  .walk-body.present { grid-template-columns: 1fr; }
  .walk-body.present .sidebar { display: none; }
  .walk-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .walk-note { border-left: 0; border-top: 1px solid var(--border); max-height: 40vh; }
  .ide-body { grid-template-columns: 200px 1fr 300px; }
}
.overlay { position: fixed; inset: 0; background: var(--shadow); display: flex; align-items: center; justify-content: center; z-index: 10; }
.overlay .box { background: var(--chrome); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 20px 26px; min-width: 320px; max-width: 560px; box-shadow: 0 20px 60px var(--shadow); font-size: 14px; }
.overlay h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.overlay table { border-collapse: collapse; }
.overlay td { padding: 3px 14px 3px 0; vertical-align: top; }
.goto { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%); background: var(--chrome); color: var(--fg); border: 1px solid var(--border); padding: 10px 18px; border-radius: 6px; font-size: 16px; z-index: 10; font-family: var(--mono); box-shadow: 0 8px 30px var(--shadow); }
.toast { position: fixed; bottom: 34px; right: 20px; background: var(--chrome); color: var(--fg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 10; box-shadow: 0 8px 30px var(--shadow); }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* =========================================================================
 * Small helpers
 * ========================================================================= */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// h('div', {class: 'x', onclick: fn}, child, child...)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'selected' || k === 'disabled') el[k] = !!v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(url, opts);
  let data;
  try { data = await res.json(); } catch (e) { data = { error: res.statusText || ('HTTP ' + res.status) }; }
  if (!res.ok) throw new Error(data && data.error ? data.error : ('HTTP ' + res.status));
  return data;
}

function short(sha) { return (sha || '').slice(0, 10); }

function firstLine(s) { return String(s || '').split('\n').find(l => l.trim()) || ''; }

function isTyping(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
}

function currentTheme() { return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'; }
function toggleTheme() {
  const t = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('tour.theme', t); } catch (e) {}
  document.querySelectorAll('.theme-btn').forEach(b => b.textContent = themeLabel());
}
function themeLabel() { return currentTheme() === 'dark' ? '☀ light' : '☾ dark'; }
function themeBtn() { return h('button', { class: 'theme-btn ghost small', title: 'Toggle dark / light', onclick: toggleTheme }, themeLabel()); }

let toastTimer = null;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = h('div', { class: 'toast' }); document.body.append(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2500);
}

/* =========================================================================
 * Syntax highlighting: line-oriented regex tokenizers.  Good enough, not a parser.
 * Multi-line state (C block comments, JS template strings, Python triple quotes)
 * is threaded through `state` from one line to the next.
 * ========================================================================= */

const KEYWORDS = {
  c: 'auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while _Bool _Complex _Static_assert bool true false NULL size_t ssize_t uint8_t uint16_t uint32_t uint64_t int8_t int16_t int32_t int64_t',
  python: 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield self cls',
  js: 'break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new return super switch this throw try typeof var void while with yield async await of static get set null undefined true false',
};
const CONTROL = {
  c: 'if else for while do switch case default break continue return goto',
  python: 'if elif else for while try except finally raise return break continue with as pass yield await import from',
  js: 'if else for while do switch case default break continue return try catch finally throw await yield import export from of',
};
const TYPES = { c: 'int char void float double long short unsigned signed bool size_t ssize_t uint8_t uint16_t uint32_t uint64_t int8_t int16_t int32_t int64_t _Bool _Complex', python: '', js: '' };
for (const k in KEYWORDS) { KEYWORDS[k] = new Set(KEYWORDS[k].split(' ')); CONTROL[k] = new Set(CONTROL[k].split(' ')); TYPES[k] = new Set(TYPES[k].split(' ').filter(Boolean)); }

function langFor(path) {
  const m = /\.([^./]+)$/.exec(path || '');
  const ext = m ? m[1].toLowerCase() : '';
  if (['c', 'h', 'cc', 'cpp', 'cxx', 'hpp', 'hh', 'hxx', 'inl'].includes(ext)) return 'c';
  if (['py', 'pyi'].includes(ext)) return 'python';
  if (['js', 'mjs', 'cjs', 'jsx', 'ts', 'json'].includes(ext)) return 'js';
  return null;
}

const STR_RE = {
  c: /^(?:"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)/,
  js: /^(?:"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)/,
  python: /^(?:[rRbBuUfF]{1,2})?(?:"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)/,
};
const NUM_RE = /^(?:0[xX][0-9a-fA-F']+|0[bB][01]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)[uUlLfFjJn]*/;
const IDENT_RE = /^[A-Za-z_$][\w$]*/;
const MULTI_END = { comment: '*/', tstr: '`', py3d: '"""', py3s: "'''" };

function hlLine(line, lang, state) {
  if (!lang) return { html: esc(line), state: null };
  let out = '';
  let i = 0;
  const push = (cls, t) => { out += cls ? '<span class="t-' + cls + '">' + esc(t) + '</span>' : esc(t); };
  if (state) {
    const end = MULTI_END[state];
    const cls = state === 'comment' ? 'comment' : 'string';
    const j = line.indexOf(end);
    if (j < 0) { push(cls, line); return { html: out, state }; }
    push(cls, line.slice(0, j + end.length));
    i = j + end.length;
    state = null;
  }
  if (lang === 'c' && i === 0 && /^\s*#/.test(line)) { push('pp', line); return { html: out, state: null }; }
  while (i < line.length) {
    const rest = line.slice(i);
    let m;
    if (lang !== 'python' && rest.startsWith('//')) { push('comment', rest); break; }
    if (lang === 'python' && rest[0] === '#') { push('comment', rest); break; }
    if (lang !== 'python' && rest.startsWith('/*')) {
      const j = rest.indexOf('*/', 2);
      if (j < 0) { push('comment', rest); return { html: out, state: 'comment' }; }
      push('comment', rest.slice(0, j + 2)); i += j + 2; continue;
    }
    if (lang === 'python' && (m = /^(?:[rRbBuUfF]{1,2})?("""|''')/.exec(rest))) {
      const q = m[1];
      const j = rest.indexOf(q, m[0].length);
      if (j < 0) { push('string', rest); return { html: out, state: q === '"""' ? 'py3d' : 'py3s' }; }
      push('string', rest.slice(0, j + q.length)); i += j + q.length; continue;
    }
    if (lang === 'js' && rest[0] === '`') {
      const j = rest.indexOf('`', 1);
      if (j < 0) { push('string', rest); return { html: out, state: 'tstr' }; }
      push('string', rest.slice(0, j + 1)); i += j + 1; continue;
    }
    if ((m = STR_RE[lang].exec(rest)) && m[0].length) { push('string', m[0]); i += m[0].length; continue; }
    if ((m = NUM_RE.exec(rest))) { push('number', m[0]); i += m[0].length; continue; }
    if ((m = IDENT_RE.exec(rest))) {
      const w = m[0];
      if (CONTROL[lang].has(w)) push('ctrl', w);
      else if (TYPES[lang].has(w)) push('type', w);
      else if (KEYWORDS[lang].has(w)) push('kw', w);
      else if (/^\s*\(/.test(rest.slice(w.length))) push('fn', w);
      else push('id', w);
      i += w.length; continue;
    }
    if (lang === 'python' && (m = /^@[\w.]+/.exec(rest))) { push('dec', m[0]); i += m[0].length; continue; }
    if ((m = /^\s+/.exec(rest))) { push(null, m[0]); i += m[0].length; continue; }
    push(null, rest[0]); i += 1;
  }
  return { html: out, state: null };
}

function hlLines(lines, lang) {
  let state = null;
  return lines.map(l => { const r = hlLine(l, lang, state); state = r.state; return r.html; });
}

/* =========================================================================
 * Files at a commit, and a shared line-by-line code view
 * ========================================================================= */

const fileCache = new Map();  // "rev:path" -> Promise<{lines, html}>
function fetchFile(path, rev) {
  const key = rev + ':' + path;
  if (!fileCache.has(key)) {
    fileCache.set(key, api('GET', '/api/file?path=' + encodeURIComponent(path) + '&rev=' + encodeURIComponent(rev))
      .then(r => ({ lines: r.lines, html: hlLines(r.lines, langFor(path)) })));
  }
  return fileCache.get(key);
}

function codeLine(no, html, cls, tag) {
  return h('div', { class: 'ln ' + cls }, h('span', { class: 'no' }, no || ''), tag !== undefined ? h('span', { class: 'tag' }, tag) : null, h('span', { class: 'src', html }));
}

// Lines of a file with [start, end] highlighted; `context` lines around it, or the whole file.
function fileView(f, start, end, opts) {
  const n = f.lines.length;
  const full = !!(opts && opts.full);
  const ctx = opts && opts.context != null ? opts.context : 8;
  const lo = full ? 1 : Math.max(1, start - ctx);
  const hi = full ? n : Math.min(n, end + ctx);
  const frag = document.createDocumentFragment();
  if (!full && lo > 1) frag.append(h('div', { class: 'gap' }, '⋯ ' + (lo - 1) + ' lines above'));
  for (let k = lo; k <= hi; k++) frag.append(codeLine(k, f.html[k - 1], k >= start && k <= end ? 'in' : 'dim'));
  if (!full && hi < n) frag.append(h('div', { class: 'gap' }, '⋯ ' + (n - hi) + ' lines below'));
  if (start > n) frag.append(h('div', { class: 'error' }, 'Range ' + start + '-' + end + ' is past the end of the file (' + n + ' lines).'));
  return frag;
}

/* =========================================================================
 * Click-to-definition (v3)
 * ========================================================================= */

// The identifier under a mouse position, or null.  Dotted names (App.view.Grid) stay whole.
function wordAtPoint(x, y) {
  let node = null, offset = 0;
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    if (p) { node = p.offsetNode; offset = p.offset; }
  } else if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    if (r) { node = r.startContainer; offset = r.startOffset; }
  }
  if (!node || node.nodeType !== 3) return null;
  const text = node.nodeValue;
  const isW = c => c !== undefined && /[\w$.]/.test(c);
  let i = offset;
  if (!isW(text[i]) && i > 0 && isW(text[i - 1])) i--;
  if (!isW(text[i])) return null;
  let a = i, b = i;
  while (a > 0 && isW(text[a - 1])) a--;
  while (b < text.length && isW(text[b])) b++;
  const w = text.slice(a, b).replace(/^[.$]+|[.]+$/g, '');
  return /^[A-Za-z_$]/.test(w) ? w : null;
}

async function findDefinitions(name, file) {
  const q = n => '/api/symbol?name=' + encodeURIComponent(n) + (file ? '&file=' + encodeURIComponent(file) : '');
  let r = await api('GET', q(name));
  if (!r.definitions.length && name.includes('.')) r = await api('GET', q(name.split('.').pop()));
  return r;
}

function defLabel(d) {
  return d.file + ':' + d.line;
}

// Show a list of candidate definitions; calls onPick(def).
function chooseDefinition(result, onPick, onClose) {
  const close = () => { box.parentElement && box.parentElement.remove(); if (onClose) onClose(); };
  const items = result.definitions.map(d => h('li', { onclick: () => { close(); onPick(d); } },
    h('span', null, h('span', { class: 'badge k ' + d.kind }, d.kind)),
    h('span', null, h('span', { class: 'f' }, defLabel(d)), d.signature ? h('span', { class: 'muted' }, ' ' + d.signature) : null,
      d.scope ? h('div', { class: 't' }, d.kind === 'method' || d.kind === 'xtype' || d.kind === 'alias' ? 'in ' + d.scope : d.scope) : null,
      d.extends ? h('div', { class: 't' }, 'extends ' + d.extends) : null),
    h('span', null, d.targets.filter(Boolean).map(t => h('span', { class: 'badge tgt', title: d.in_binary ? 'present in this target\'s binary' : '' }, (d.in_binary ? '● ' : '') + t)))));
  const box = h('div', { class: 'box', onclick: e => e.stopPropagation() },
    h('h2', null, result.name + ' · ' + result.definitions.length + ' definitions' + (result.target ? ' · from ' + result.target : '')),
    h('ul', { class: 'def-list' }, items),
    h('p', { class: 'muted', style: 'margin:10px 0 0' }, 'Esc closes.'));
  const overlay = h('div', { class: 'overlay', onclick: close });
  overlay.append(box);
  document.body.append(overlay);
  return close;
}

// Look a name up and hand the winning definition to onPick, asking when it is ambiguous.
async function jumpToDefinition(name, file, onPick, hooks) {
  let r;
  try { r = await findDefinitions(name, file); }
  catch (e) { toast(/index/.test(e.message) ? 'No symbol index yet: rebuild it from the home page.' : e.message); return; }
  if (!r.definitions.length) { toast('No definition found for ' + name); return; }
  if (r.preferred != null) { onPick(r.definitions[r.preferred], r); return; }
  if (hooks && hooks.onOpen) hooks.onOpen();
  chooseDefinition(r, d => onPick(d, r), hooks && hooks.onClose);
}

/* ----- index status ----- */
function indexSummary(st) {
  if (st.building) return 'building index… ' + (st.progress || '');
  if (!st.exists) return 'no symbol index yet';
  const parts = [st.symbols + ' symbols'];
  if (st.targets && st.targets.length) parts.push('targets: ' + st.targets.join(', '));
  if (st.built_at) parts.push('built ' + st.built_at.replace('T', ' ') + ' in ' + st.duration + 's');
  if (st.errors && st.errors.length) parts.push(st.errors.length + ' warning' + (st.errors.length === 1 ? '' : 's'));
  return parts.join(' · ');
}

// Poll /api/index until a build finishes; calls onUpdate(status) each time.
function watchIndex(onUpdate) {
  let stop = false;
  (async function tick() {
    if (stop) return;
    let st;
    try { st = await api('GET', '/api/index'); } catch (e) { return; }
    onUpdate(st);
    if (st.building) setTimeout(tick, 1000);
  })();
  return () => { stop = true; };
}

/* =========================================================================
 * Minimal markdown: paragraphs, `code`, fenced code, lists, **bold**.
 * ========================================================================= */

function mdInline(s) {
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  return s.replace(/\n/g, '<br>');
}

function md(text) {
  const parts = String(text || '').replace(/\r/g, '').split(/^```[^\n]*\n?/m);
  let html = '';
  parts.forEach((part, idx) => {
    if (idx % 2 === 1) { html += '<pre>' + esc(part.replace(/\n$/, '')) + '</pre>'; return; }
    for (const block of part.split(/\n\s*\n/)) {
      const lines = block.split('\n').filter(l => l.trim() !== '');
      if (!lines.length) continue;
      if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
        html += '<ul>' + lines.map(l => '<li>' + mdInline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>';
      } else if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) {
        html += '<ol>' + lines.map(l => '<li>' + mdInline(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>').join('') + '</ol>';
      } else if (/^#{1,3}\s/.test(lines[0]) && lines.length === 1) {
        const lvl = /^#+/.exec(lines[0])[0].length;
        html += '<h' + (lvl + 1) + '>' + mdInline(lines[0].replace(/^#+\s*/, '')) + '</h' + (lvl + 1) + '>';
      } else {
        html += '<p>' + mdInline(lines.join('\n')) + '</p>';
      }
    }
  });
  return html;
}

/* =========================================================================
 * Diff rows: turn hunks into table rows for unified or side-by-side display.
 * ========================================================================= */

function hunkLabel(hk) { return '@@ -' + hk.old_start + ',' + hk.old_len + ' +' + hk.new_start + ',' + hk.new_len + ' @@'; }

function unifiedRows(file) {
  const rows = [];
  file.hunks.forEach((hk, hi) => {
    rows.push({ type: 'hunk', hunk: hi, text: hunkLabel(hk) });
    let o = hk.old_start, n = hk.new_start;
    for (const l of hk.lines) {
      const tag = l[0], text = l.slice(1);
      if (tag === '+') rows.push({ type: 'add', newNo: n++, text });
      else if (tag === '-') rows.push({ type: 'del', oldNo: o++, text });
      else rows.push({ type: 'ctx', oldNo: o++, newNo: n++, text });
    }
  });
  return rows;
}

function sideRows(file) {
  const rows = [];
  file.hunks.forEach((hk, hi) => {
    rows.push({ type: 'hunk', hunk: hi, text: hunkLabel(hk) });
    let o = hk.old_start, n = hk.new_start, i = 0;
    const L = hk.lines;
    while (i < L.length) {
      if (L[i][0] !== '+' && L[i][0] !== '-') {
        const text = L[i].slice(1);
        rows.push({ type: 'ctx', left: { no: o++, text }, right: { no: n++, text } });
        i++; continue;
      }
      const dels = [], adds = [];
      while (i < L.length && L[i][0] === '-') dels.push(L[i++].slice(1));
      while (i < L.length && L[i][0] === '+') adds.push(L[i++].slice(1));
      const k = Math.max(dels.length, adds.length);
      for (let j = 0; j < k; j++) {
        rows.push({
          type: 'change',
          left: j < dels.length ? { no: o++, text: dels[j], tag: 'del' } : null,
          right: j < adds.length ? { no: n++, text: adds[j], tag: 'add' } : null,
        });
      }
    }
  });
  return rows;
}

/* =========================================================================
 * Router
 * ========================================================================= */

const app = document.getElementById('app');
let current = null;  // { onKey(e), destroy() }

document.addEventListener('keydown', e => { if (current && current.onKey) current.onKey(e); });
window.addEventListener('hashchange', route);

function route() {
  if (current && current.destroy) current.destroy();
  current = null;
  app.innerHTML = '';
  document.querySelectorAll('.overlay, .goto, .toast').forEach(el => el.remove());
  const hash = location.hash.replace(/^#/, '');
  const m = /^(author|walk|present)\/([^/]+)(?:\/(\d+))?$/.exec(hash);
  if (!m) { current = homeView(); return; }
  const id = decodeURIComponent(m[2]);
  const idx = m[3] ? parseInt(m[3], 10) - 1 : 0;
  current = m[1] === 'author' ? authorView(id) : walkView(id, idx, m[1] === 'present');
}

function showError(err) {
  app.innerHTML = '';
  app.append(h('div', { class: 'error' }, String(err.message || err)), h('p', { style: 'padding:0 12px' }, h('a', { href: '#' }, 'Back to reviews')));
}

/* =========================================================================
 * Home: list reviews, start a new one
 * ========================================================================= */

function homeView() {
  document.title = 'Tour';
  let stopWatch = null;
  (async () => {
    let cfg, reviews, refs, refsErr = null;
    try {
      [cfg, reviews] = await Promise.all([api('GET', '/api/config'), api('GET', '/api/reviews')]);
      try { refs = await api('GET', '/api/refs'); } catch (e) { refsErr = e; }
    } catch (e) { showError(e); return; }

    const list = reviews.length
      ? h('ul', { class: 'review-list' }, reviews.map(r => h('li', null,
          h('a', { class: 't', href: '#author/' + encodeURIComponent(r.id) }, r.title || r.id),
          h('span', { class: 'muted' }, r.stops + (r.stops === 1 ? ' stop' : ' stops')),
          h('span', { class: 'muted' }, r.author),
          h('span', { class: 'muted' }, (r.created || '').replace('T', ' ').slice(0, 16)),
          h('a', { href: '#author/' + encodeURIComponent(r.id) }, 'edit'),
          h('a', { href: '#present/' + encodeURIComponent(r.id) }, 'present'),
          h('a', { href: '#walk/' + encodeURIComponent(r.id) }, 'walk'))))
      : h('p', { class: 'muted' }, 'No reviews yet. Create one below; it is saved as ', h('code', null, cfg.tours_dir + '/<id>.json'), ' in the repo.');

    let form;
    if (refs) {
      const opts = [];
      const seen = new Set();
      const add = (value, label) => { if (seen.has(value)) return; seen.add(value); opts.push(h('option', { value }, label)); };
      for (const b of refs.branches) add(b.sha, b.name + '  ' + short(b.sha));
      for (const t of refs.tags) add(t.sha, 'tag ' + t.name + '  ' + short(t.sha));
      for (const c of refs.commits) add(c.sha, short(c.sha) + '  ' + c.subject);
      const datalist = h('datalist', { id: 'refs' }, opts);
      const title = h('input', { type: 'text', placeholder: 'e.g. IPC refactor', autofocus: true });
      const base = h('input', { type: 'text', list: 'refs', value: refs.default_base, spellcheck: 'false', class: 'mono' });
      const head = h('input', { type: 'text', list: 'refs', value: refs.default_head, spellcheck: 'false', class: 'mono' });
      const btn = h('button', { class: 'primary' }, 'Create draft');
      const msg = h('span', { class: 'muted' });
      const submit = async (e) => {
        e.preventDefault();
        if (!title.value.trim()) { title.focus(); return; }
        btn.disabled = true; msg.textContent = 'Diffing…';
        try {
          const r = await api('POST', '/api/draft', { base: base.value.trim(), head: head.value.trim(), title: title.value.trim() });
          location.hash = '#author/' + encodeURIComponent(r.id);
        } catch (err) { msg.textContent = err.message; btn.disabled = false; }
      };
      form = h('form', { class: 'form-grid', onsubmit: submit },
        h('div', { class: 'wide' }, h('label', null, 'Title'), title),
        h('div', null, h('label', null, 'Base (default: merge-base with main)'), base),
        h('div', null, h('label', null, 'Head (default: HEAD)'), head),
        datalist,
        h('div', { class: 'wide row' }, btn, msg,
          h('span', { class: 'muted grow' }),
          h('span', { class: 'muted' }, 'Any revision works: branch, tag, hash, HEAD~3.')));
    } else {
      form = h('div', { class: 'error', style: 'margin:0' }, 'Cannot read git refs: ' + refsErr.message);
    }

    const idxCard = h('div', { class: 'card index-card' });
    const paintIndex = st => {
      idxCard.innerHTML = '';
      const btn = h('button', { class: 'small', disabled: st.building, onclick: async () => {
        try { const r = await api('POST', '/api/index/rebuild', {}); paintIndex(r); if (stopWatch) stopWatch(); stopWatch = watchIndex(paintIndex); }
        catch (e) { toast(e.message); }
      } }, st.building ? 'building…' : (st.exists ? '⟳ Rebuild index' : '⟳ Build index'));
      idxCard.append(
        h('h2', null, 'Symbol index'),
        h('div', { class: 'row' }, h('span', { class: 'grow' }, indexSummary(st)), btn),
        st.exists && !st.building ? h('div', { class: 'muted', style: 'margin-top:6px;font-size:12px' },
          Object.entries(st.by_target || {}).map(([t, n]) => (t || '(no target)') + ': ' + n).join(' · ')) : null,
        st.errors && st.errors.length ? h('div', { class: 'errs' }, st.errors.slice(0, 8).join('\n') + (st.errors.length > 8 ? '\n… ' + (st.errors.length - 8) + ' more' : '')) : null,
        h('div', { class: 'muted', style: 'margin-top:8px;font-size:12px' }, 'Built from the working tree: ctags for C and JavaScript, the stdlib ast for Python, nm for binaries, and the preprocessor for macro-generated symbols. Click any name in a walkthrough to jump to its definition.'));
    };
    stopWatch = watchIndex(paintIndex);
    app.append(h('div', { class: 'home' },
      h('div', { class: 'row' }, h('h1', { class: 'grow' }, 'Tour'), themeBtn()),
      h('div', { class: 'muted' }, cfg.name, ' · reviews live in ', h('code', null, cfg.tours_dir + '/')),
      h('div', { class: 'card' }, h('h2', null, 'Reviews'), list),
      h('div', { class: 'card' }, h('h2', null, 'New review'), form),
      idxCard));
    if (refs) app.querySelector('input[type=text]').focus();
  })();
  return { destroy() { if (stopWatch) stopWatch(); } };
}

/* =========================================================================
 * Author: build the stop list from a diff
 * ========================================================================= */

function authorView(id) {
  const S = {
    review: null, files: [], fileIdx: 0, mode: localStorage.getItem('tour.diffmode') || 'unified',
    rows: [], sel: null, dragging: false, stopId: null, editorRow: null,
    dirty: false, saveTimer: null, saving: false, saveErr: null,
  };
  const els = {};

  /* ----- persistence ----- */
  function scheduleSave() {
    S.dirty = true; paintSaved();
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(save, 1000);
  }
  async function save(sync) {
    clearTimeout(S.saveTimer);
    if (!S.dirty) return;
    S.saving = true; paintSaved();
    try {
      if (sync) {
        await fetch('/api/review/' + encodeURIComponent(id), { method: 'PUT', keepalive: true,
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S.review) });
      } else {
        await api('PUT', '/api/review/' + encodeURIComponent(id), S.review);
      }
      S.dirty = false; S.saveErr = null;
    } catch (e) { S.saveErr = e.message; }
    S.saving = false; paintSaved();
    if (S.saveErr) S.dirty = true;
  }
  function paintSaved() {
    if (!els.saved) return;
    els.saved.className = 'saved' + (S.saveErr ? ' err' : '');
    els.saved.textContent = S.saveErr ? '⚠ save failed: ' + S.saveErr : S.saving ? '● saving…' : S.dirty ? '● unsaved' : '✓ saved';
  }
  function renderStatus() {
    if (!els.statusPos) return;
    const st = S.stopId ? stopById(S.stopId) : null;
    const idx = st ? stops().indexOf(st) + 1 : 0;
    els.statusPos.textContent = st ? 'stop ' + idx + ' / ' + stops().length : stops().length + ' stops';
    els.statusMode.textContent = S.mode === 'unified' ? 'unified' : 'side-by-side';
    els.statusFile.textContent = S.files[S.fileIdx] ? (S.fileIdx + 1) + ' / ' + S.files.length + ' files' : '';
  }
  const flushOnLeave = () => { if (S.dirty) save(true); };
  window.addEventListener('beforeunload', flushOnLeave);

  /* ----- stops ----- */
  const stops = () => S.review.stops;
  const stopById = sid => stops().find(s => s.id === sid);
  function nextStopId() {
    let n = 0;
    for (const s of stops()) { const m = /^s(\d+)$/.exec(s.id); if (m) n = Math.max(n, +m[1]); }
    return 's' + (n + 1);
  }
  function sideFile(f, side) { return side === 'base' ? (f.old_file || f.file) : (f.new_file || f.file); }

  function selectStop(sid, opts) {
    S.stopId = sid;
    const st = stopById(sid);
    if (st && !(opts && opts.noScroll)) {
      const fi = S.files.findIndex(f => sideFile(f, st.side || 'head') === st.file || f.file === st.file);
      if (fi >= 0 && fi !== S.fileIdx) { S.fileIdx = fi; renderFiles(); renderDiff(); }
      scrollToStop(st);
    }
    renderStops();
    renderStopEditor();
    paintRows();
    renderStatus();
  }

  function scrollToStop(st) {
    const rows = S.rows;
    for (let i = 0; i < rows.length; i++) {
      if (rowNo(rows[i], st.side || 'head') === st.start) {
        const tr = els.tbody && els.tbody.children[i];
        if (tr) tr.scrollIntoView({ block: 'center' });
        return;
      }
    }
  }

  // The line number a row has on a given side, or 0.
  function rowNo(row, side) {
    if (row.type === 'hunk') return 0;
    if (S.mode === 'unified') return (side === 'base' ? row.oldNo : row.newNo) || 0;
    const c = side === 'base' ? row.left : row.right;
    return c ? c.no : 0;
  }

  function addStop(range, kind, note) {
    const st = { id: nextStopId(), file: range.file, start: range.start, end: range.end, side: range.side,
                 kind, note, presenter_note: '', flags: [] };
    stops().push(st);
    S.sel = null;
    scheduleSave();
    selectStop(st.id, { noScroll: true });
    toast('Added stop ' + stops().length);
  }

  function moveStop(sid, delta) {
    const arr = stops();
    const i = arr.findIndex(s => s.id === sid);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    scheduleSave(); renderStops(); renderStatus();
  }

  function deleteStop(sid) {
    const arr = stops();
    const i = arr.findIndex(s => s.id === sid);
    if (i < 0) return;
    if (!confirm('Delete stop ' + (i + 1) + '?')) return;
    arr.splice(i, 1);
    S.stopId = arr[Math.min(i, arr.length - 1)] ? arr[Math.min(i, arr.length - 1)].id : null;
    scheduleSave(); renderStops(); renderStopEditor(); paintRows(); renderStatus();
  }

  /* ----- selection ----- */
  function selectionRange() {
    if (!S.sel || !S.files[S.fileIdx]) return null;
    const lo = Math.min(S.sel.a, S.sel.b), hi = Math.max(S.sel.a, S.sel.b);
    const file = S.files[S.fileIdx];
    let side = S.sel.side, nums = [];
    if (S.mode === 'unified') {
      // Head side unless the selection contains removed lines and no added lines.
      const heads = [], bases = [];
      let adds = 0, dels = 0;
      for (let i = lo; i <= hi; i++) {
        const r = S.rows[i];
        if (r.type === 'hunk') continue;
        if (r.type === 'add') adds++; else if (r.type === 'del') dels++;
        if (r.newNo) heads.push(r.newNo);
        if (r.oldNo) bases.push(r.oldNo);
      }
      if (dels && !adds && bases.length) { side = 'base'; nums = bases; }
      else if (heads.length) { side = 'head'; nums = heads; }
      else { side = 'base'; nums = bases; }
    } else {
      for (let i = lo; i <= hi; i++) { const n = rowNo(S.rows[i], side); if (n) nums.push(n); }
    }
    if (!nums.length) return null;
    return { side, start: Math.min(...nums), end: Math.max(...nums), file: sideFile(file, side) };
  }

  function clearSelection() { S.sel = null; closeEditor(); paintRows(); }

  /* ----- inline note editor (press n) ----- */
  function openEditor() {
    const range = selectionRange();
    if (!range) { toast('Select lines first: click-drag the line numbers.'); return; }
    closeEditor();
    const hi = Math.max(S.sel.a, S.sel.b);
    const kind = h('select', null, ['change', 'context', 'question'].map(k => h('option', { value: k }, k)));
    const note = h('textarea', { placeholder: 'Note shown to the room (markdown-ish). Enter saves, Shift+Enter for a new line, Esc cancels.', rows: 3 });
    note.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addStop(range, kind.value, note.value.trim()); closeEditor(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      e.stopPropagation();
    });
    kind.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditor(); e.stopPropagation(); });
    const tr = h('tr', { class: 'editor-row' }, h('td', { colspan: S.mode === 'unified' ? 3 : 4 },
      h('div', { class: 'row', style: 'margin-bottom:6px' },
        h('b', null, 'New stop'), h('span', { class: 'mono' }, range.file + ':' + range.start + (range.end !== range.start ? '-' + range.end : '') + (range.side === 'base' ? ' (base)' : '')),
        h('span', { class: 'grow' }), h('label', { style: 'margin:0' }, 'kind'), kind),
      note,
      h('div', { class: 'row', style: 'margin-top:6px' },
        h('button', { class: 'primary small', onclick: () => { addStop(range, kind.value, note.value.trim()); closeEditor(); } }, 'Add stop'),
        h('button', { class: 'small', onclick: closeEditor }, 'Cancel'))));
    const after = els.tbody.children[hi];
    after.after(tr);
    S.editorRow = tr;
    note.focus();
  }
  function closeEditor() { if (S.editorRow) { S.editorRow.remove(); S.editorRow = null; } }

  /* ----- rendering ----- */
  function renderFiles() {
    els.files.innerHTML = '';
    if (!S.files.length) { els.files.append(h('li', { class: 'muted' }, 'No changes between base and head.')); return; }
    let lastDir = null;
    S.files.forEach((f, i) => {
      const n = stops().filter(s => s.file === f.file || s.file === f.old_file).length;
      const slash = f.file.lastIndexOf('/');
      const dir = slash >= 0 ? f.file.slice(0, slash) : '';
      if (dir !== lastDir) { els.files.append(h('li', { class: 'dir', title: dir }, dir || '(root)')); lastDir = dir; }
      els.files.append(h('li', { class: 'file' + (i === S.fileIdx ? ' active' : ''), title: f.file, onclick: () => { S.fileIdx = i; S.sel = null; renderFiles(); renderDiff(); renderStatus(); } },
        h('span', { class: 'st ' + f.status }, { added: 'A', deleted: 'D', renamed: 'R', modified: 'M' }[f.status] || 'M'),
        h('span', { class: 'name' }, f.file.slice(slash + 1)),
        h('span', { class: 'n' }, f.binary ? 'bin' : f.hunks.length + (n ? ' · ' + n + '★' : ''))));
    });
  }

  function renderDiff() {
    closeEditor();
    const f = S.files[S.fileIdx];
    els.path.textContent = f ? (f.status === 'renamed' ? f.old_file + ' → ' + f.new_file : f.file) : 'no file';
    els.scroll.innerHTML = '';
    if (!f) { els.scroll.append(h('div', { class: 'empty-msg' }, 'Nothing to show.')); S.rows = []; return; }
    if (f.binary || !f.hunks.length) { els.scroll.append(h('div', { class: 'empty-msg' }, f.binary ? 'Binary file.' : 'No hunks (mode or rename only).')); S.rows = []; return; }
    const lang = langFor(f.file);
    const table = h('table', { class: 'diff ' + S.mode });
    const cols = S.mode === 'unified' ? ['52px', '52px', ''] : ['52px', '', '52px', ''];
    table.append(h('colgroup', null, cols.map(w => h('col', { style: w ? 'width:' + w : '' }))));
    const tbody = h('tbody');
    table.append(tbody);
    if (S.mode === 'unified') {
      S.rows = unifiedRows(f);
      let state = null;
      S.rows.forEach((r, i) => {
        if (r.type === 'hunk') { state = null; tbody.append(h('tr', { class: 'hunk', 'data-i': i }, h('td', { colspan: 3 }, r.text))); return; }
        const hl = hlLine(r.text, lang, state); state = hl.state;
        tbody.append(h('tr', { class: r.type, 'data-i': i },
          h('td', { class: 'gut old', 'data-side': 'base' }, r.oldNo || ''),
          h('td', { class: 'gut new', 'data-side': 'head' }, r.newNo || ''),
          h('td', { class: 'code', html: '<span class="tag">' + ({ add: '+', del: '-', ctx: ' ' })[r.type] + '</span>' + hl.html })));
      });
    } else {
      S.rows = sideRows(f);
      let ls = null, rs = null;
      S.rows.forEach((r, i) => {
        if (r.type === 'hunk') { ls = rs = null; tbody.append(h('tr', { class: 'hunk', 'data-i': i }, h('td', { colspan: 4 }, r.text))); return; }
        let lh = '', rh = '';
        if (r.left) { const x = hlLine(r.left.text, lang, ls); ls = x.state; lh = x.html; }
        if (r.right) { const x = hlLine(r.right.text, lang, rs); rs = x.state; rh = x.html; }
        tbody.append(h('tr', { class: r.type, 'data-i': i },
          h('td', { class: 'gut old', 'data-side': 'base' }, r.left ? r.left.no : ''),
          h('td', { class: 'code left ' + (r.left ? (r.left.tag || '') : 'empty'), html: lh }),
          h('td', { class: 'gut new', 'data-side': 'head' }, r.right ? r.right.no : ''),
          h('td', { class: 'code right ' + (r.right ? (r.right.tag || '') : 'empty'), html: rh })));
      });
    }
    els.tbody = tbody;
    els.scroll.append(table);
    paintRows();
  }

  // Selection and current-stop highlighting, without rebuilding the table.
  function paintRows() {
    if (!els.tbody) return;
    const st = S.stopId ? stopById(S.stopId) : null;
    const f = S.files[S.fileIdx];
    const stopHere = st && f && st.file === sideFile(f, st.side || 'head');
    const lo = S.sel ? Math.min(S.sel.a, S.sel.b) : -1, hi = S.sel ? Math.max(S.sel.a, S.sel.b) : -1;
    const trs = els.tbody.children;
    for (let i = 0; i < S.rows.length; i++) {
      const tr = trs[i];
      if (!tr) break;
      tr.classList.toggle('sel', i >= lo && i <= hi && S.rows[i].type !== 'hunk');
      let inStop = false;
      if (stopHere) { const n = rowNo(S.rows[i], st.side || 'head'); inStop = n >= st.start && n <= st.end; }
      tr.classList.toggle('stop-range', inStop);
    }
  }

  function renderStops() {
    els.stops.innerHTML = '';
    const arr = stops();
    if (!arr.length) { els.stops.append(h('li', { class: 'muted', style: 'display:block' }, 'No stops yet. Select lines in the diff and press ', h('kbd', null, 'n'), '.')); return; }
    arr.forEach((st, i) => {
      const li = h('li', { class: st.id === S.stopId ? 'active' : '', draggable: 'true', 'data-id': st.id,
        onclick: () => selectStop(st.id) },
        h('span', { class: 'grip', title: 'drag to reorder' }, '⋮'),
        h('div', null,
          h('div', { class: 'loc' }, h('span', { class: 'idx' }, i + 1 + '.'), h('span', { class: 'badge ' + (st.kind || 'change') }, st.kind || 'change'),
            h('span', { class: 'f', title: st.file }, st.file.split('/').pop() + ':' + st.start + (st.end !== st.start ? '-' + st.end : '') + (st.side === 'base' ? ' (base)' : ''))),
          h('div', { class: 'note1' + (firstLine(st.note) ? '' : ' empty') }, firstLine(st.note) || 'no note yet')));
      li.addEventListener('dragstart', e => { S.drag = st.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', st.id); } catch (_) {} });
      li.addEventListener('dragend', () => { li.classList.remove('dragging'); if (S.drag) { S.drag = null; scheduleSave(); renderStops(); } });
      li.addEventListener('dragover', e => {
        e.preventDefault();
        if (!S.drag || S.drag === st.id) return;
        const a = arr.findIndex(s => s.id === S.drag), b = arr.findIndex(s => s.id === st.id);
        if (a < 0 || b < 0) return;
        const [moved] = arr.splice(a, 1);
        arr.splice(b, 0, moved);
        // Move the DOM node too so the drag keeps flowing without a re-render.
        const dragEl = els.stops.querySelector('[data-id="' + S.drag + '"]');
        if (dragEl) { if (a < b) li.after(dragEl); else li.before(dragEl); }
        els.stops.querySelectorAll('.idx').forEach((el, k) => el.textContent = (k + 1) + '.');
      });
      els.stops.append(li);
    });
    els.stops.addEventListener('drop', e => e.preventDefault());
  }

  function renderStopEditor() {
    els.edit.innerHTML = '';
    const st = S.stopId ? stopById(S.stopId) : null;
    if (!st) { els.edit.append(h('div', { class: 'muted' }, 'Select a stop to edit its note.')); return; }
    const idx = stops().indexOf(st);
    const kind = h('select', { value: st.kind || 'change', onchange: () => { st.kind = kind.value; scheduleSave(); renderStops(); } },
      ['change', 'context', 'question'].map(k => h('option', { value: k, selected: k === (st.kind || 'change') }, k)));
    const note = h('textarea', { rows: 5, value: st.note || '', placeholder: 'Note shown to the room. Paragraphs, `code`, - lists, **bold**.',
      oninput: () => { st.note = note.value; scheduleSave(); renderStops(); } });
    const pnote = h('textarea', { rows: 2, value: st.presenter_note || '', placeholder: 'Presenter-only note (never shown on the projector).',
      oninput: () => { st.presenter_note = pnote.value; scheduleSave(); } });
    els.edit.append(...[
      h('div', { class: 'row' }, h('b', null, 'Stop ' + (idx + 1)), h('span', { class: 'loc grow' }, st.file + ':' + st.start + (st.end !== st.start ? '-' + st.end : '') + (st.side === 'base' ? ' (base)' : '')), kind),
      h('div', null, h('label', null, 'Note'), note),
      h('div', null, h('label', null, 'Presenter note'), pnote),
      st.flags && st.flags.length ? h('div', { class: 'muted', style: 'font-size:12px' }, st.flags.length + ' flag(s) from walkthroughs: ', st.flags.map(f => h('div', null, '• ' + f.text + ' — ' + f.by))) : null,
      h('div', { class: 'row' },
        h('button', { class: 'small', onclick: () => moveStop(st.id, -1) }, '↑ up'),
        h('button', { class: 'small', onclick: () => moveStop(st.id, 1) }, '↓ down'),
        h('span', { class: 'grow' }),
        h('button', { class: 'small danger', onclick: () => deleteStop(st.id) }, 'Delete')),
    ].filter(Boolean));
  }

  function render() {
    const r = S.review;
    document.title = r.title + ' · Tour';
    els.title = h('input', { class: 'title', type: 'text', value: r.title, oninput: () => { r.title = els.title.value; scheduleSave(); } });
    els.saved = h('span', { class: 'saved' }, '✓ saved');
    els.statusPos = h('span'); els.statusMode = h('span'); els.statusFile = h('span');
    els.files = h('ul', { class: 'tree' });
    els.path = h('span', { class: 'path' });
    els.scroll = h('div', { class: 'editor-scroll can-peek' });
    els.stops = h('ul', { class: 'stop-list' });
    els.edit = h('div', { class: 'stop-edit' });
    els.indexBtn = h('button', { class: 'small ghost', title: 'symbol index', onclick: async () => {
      try { const st = await api('POST', '/api/index/rebuild', {}); paintIndexBtn(st); toast('Rebuilding the symbol index…'); S.stopWatch = watchIndex(paintIndexBtn); }
      catch (e) { toast(e.message); }
    } }, '⟳ index');
    const paintIndexBtn = st => { els.indexBtn.textContent = st.building ? '⟳ indexing…' : '⟳ index'; els.indexBtn.title = indexSummary(st); };
    S.stopWatch = watchIndex(paintIndexBtn);
    const modeBtn = h('button', { class: 'small ghost', onclick: () => { S.mode = S.mode === 'unified' ? 'side' : 'unified'; localStorage.setItem('tour.diffmode', S.mode); S.sel = null; modeBtn.textContent = S.mode === 'unified' ? '⇆ side-by-side' : '☰ unified'; renderDiff(); renderStatus(); } },
      S.mode === 'unified' ? '⇆ side-by-side' : '☰ unified');
    app.append(h('div', { class: 'ide author' },
      h('div', { class: 'titlebar' },
        h('a', { href: '#', class: 'brand' }, 'Tour'),
        h('span', { class: 'sep' }, '›'),
        els.title,
        h('span', { class: 'muted sha' }, short(r.base) + ' → ' + short(r.head)),
        h('span', { class: 'grow' }),
        els.indexBtn,
        themeBtn(),
        h('a', { href: '#present/' + encodeURIComponent(id), target: '_blank' }, h('button', { class: 'primary small' }, '🎤 Present')),
        h('a', { href: '#walk/' + encodeURIComponent(id), target: '_blank' }, h('button', { class: 'small' }, '▶ Walk'))),
      h('div', { class: 'ide-body' },
        h('div', { class: 'sidebar' }, h('h3', null, 'Changes (' + S.files.length + ')'), els.files),
        h('div', { class: 'editor' },
          h('div', { class: 'tabs' },
            h('div', { class: 'tab' }, els.path),
            h('div', { class: 'tools' }, h('span', null, 'drag line numbers, then ', h('kbd', null, 'n')), modeBtn)),
          els.scroll),
        h('div', { class: 'panel' },
          h('h3', null, 'Stops'),
          els.stops,
          els.edit,
          h('div', { class: 'hint' }, h('kbd', null, 'n'), ' new stop · ', h('kbd', null, '↑/↓'), ' select · ', h('kbd', null, 'Ctrl+↑/↓'), ' reorder · ', h('kbd', null, 'Esc'), ' clear'))),
      h('div', { class: 'statusbar' },
        h('span', null, '⎇ ' + short(r.base) + ' → ' + short(r.head)),
        els.saved,
        h('span', { class: 'right' }, els.statusFile, els.statusMode, els.statusPos))));

    // Line-number selection: mousedown to anchor, drag to extend, shift-click to extend.
    els.scroll.addEventListener('mousedown', e => {
      const gut = e.target.closest('td.gut');
      if (!gut) return;
      e.preventDefault();
      const tr = gut.closest('tr');
      const i = +tr.dataset.i;
      const side = gut.dataset.side;
      if (e.shiftKey && S.sel) { S.sel.b = i; if (S.mode !== 'unified') S.sel.side = side; }
      else S.sel = { a: i, b: i, side };
      S.dragging = true;
      closeEditor();
      paintRows();
    });
    // Click a name in the diff: jump to its definition in a modal; optionally add it as a context stop.
    els.scroll.addEventListener('click', e => {
      if (S.dragging || !e.target.closest('td.code') || e.detail !== 1) return;
      if (window.getSelection && String(window.getSelection()).length) return;  // text selection, not a click
      const name = wordAtPoint(e.clientX, e.clientY);
      const f = S.files[S.fileIdx];
      if (!name || !f) return;
      jumpToDefinition(name, f.file, d => openPeek(name, d));
    });
    els.scroll.addEventListener('mouseover', e => {
      if (!S.dragging || !S.sel) return;
      const tr = e.target.closest('tr[data-i]');
      if (!tr) return;
      const i = +tr.dataset.i;
      if (i !== S.sel.b) { S.sel.b = i; paintRows(); }
    });
    document.addEventListener('mouseup', onMouseUp);

    renderFiles(); renderDiff(); renderStops(); renderStopEditor(); renderStatus();
    if (stops().length) selectStop(stops()[0].id);
  }
  function onMouseUp() { S.dragging = false; }

  // Definition viewer for the author: the file at head, scrolled to the definition.
  async function openPeek(name, d) {
    const code = h('div', { class: 'walk-code can-peek' });
    const close = () => overlay.remove();
    const addBtn = h('button', { class: 'primary small', onclick: () => {
      const f = fileCache.get(S.review.head + ':' + d.file);
      const line = d.line;
      const st = { id: nextStopId(), file: d.file, start: line, end: line, side: 'head', kind: 'context',
                   note: '`' + name + '` is defined here.', presenter_note: '', flags: [] };
      stops().push(st);
      scheduleSave();
      close();
      selectStop(st.id, { noScroll: true });
      toast('Added context stop ' + stops().length + ' at ' + d.file + ':' + line);
    } }, '+ Add as context stop');
    const overlay = h('div', { class: 'overlay', onclick: close },
      h('div', { class: 'box peek', onclick: e => e.stopPropagation() },
        h('div', { class: 'peek-head' },
          h('b', null, name), h('span', { class: 'badge k ' + d.kind }, d.kind),
          h('span', { class: 'mono' }, defLabel(d)), d.signature ? h('span', { class: 'muted' }, d.signature) : null,
          d.targets.filter(Boolean).map(t => h('span', { class: 'badge tgt' }, (d.in_binary ? '● ' : '') + t)),
          h('span', { class: 'grow' }), addBtn, h('button', { class: 'small', onclick: close }, 'Close')),
        code,
        h('div', { class: 'peek-foot' }, 'Showing the file at head ', h('span', { class: 'sha' }, short(S.review.head)),
          '. The index is built from the working tree, so lines can drift if it differs. Click another name to keep following. Esc closes.')));
    document.body.append(overlay);
    S.peekOverlay = overlay;
    code.addEventListener('click', e => {
      const n = wordAtPoint(e.clientX, e.clientY);
      if (n) jumpToDefinition(n, d.file, d2 => { close(); openPeek(n, d2); });
    });
    try {
      const f = await fetchFile(d.file, S.review.head);
      code.append(fileView(f, d.line, d.line, { full: true }));
      const first = code.querySelector('.ln.in');
      if (first) first.scrollIntoView({ block: 'center' });
    } catch (e) { code.append(h('div', { class: 'error' }, e.message)); }
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      const ov = document.querySelector('.overlay');
      if (ov) { ov.remove(); return; }
      if (isTyping(e)) e.target.blur(); clearSelection(); return;
    }
    if (document.querySelector('.overlay')) return;
    if (isTyping(e)) return;
    if (e.key === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openEditor(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && S.stopId) {
      e.preventDefault(); moveStop(S.stopId, e.key === 'ArrowUp' ? -1 : 1); return;
    }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.ctrlKey && !e.metaKey && stops().length) {
      e.preventDefault();
      const arr = stops();
      const i = Math.max(0, arr.findIndex(s => s.id === S.stopId));
      const j = Math.min(arr.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)));
      selectStop(arr[j].id);
    }
  }

  (async () => {
    try {
      S.review = await api('GET', '/api/review/' + encodeURIComponent(id));
      if (!Array.isArray(S.review.stops)) S.review.stops = [];
      S.files = await api('GET', '/api/diff?base=' + encodeURIComponent(S.review.base) + '&head=' + encodeURIComponent(S.review.head));
      render();
    } catch (e) { showError(e); }
  })();

  return {
    onKey,
    destroy() {
      window.removeEventListener('beforeunload', flushOnLeave);
      document.removeEventListener('mouseup', onMouseUp);
      if (S.stopWatch) S.stopWatch();
      flushOnLeave();
    },
  };
}

/* =========================================================================
 * Walkthrough (projector) and presenter tab.  One view, two flavours:
 *   #walk/<id>     projector: minimal chrome, follows the presenter when one is live
 *   #present/<id>  presenter: stop list, private notes, up-next; pushes state
 * ========================================================================= */

const VIEW_MODES = ['stop', 'full', 'diff', 'peek', 'expand'];

function walkView(id, startIndex, presenter) {
  const S = {
    review: null, i: 0, mode: 'stop', files: new Map(), diff: null, goto: null, help: false, flag: null,
    font: parseInt(localStorage.getItem('tour.font'), 10) || 18, renderToken: 0,
    following: false, projector: false, lastApplied: '', pollTimer: null, beatTimer: null, peek: null,
  };
  const els = {};
  const CONTEXT = 8;

  const stops = () => S.review.stops || [];
  const cur = () => stops()[S.i];
  const revFor = st => (st.side === 'base' ? S.review.base : S.review.head);
  const locOf = st => st.file + ':' + st.start + (st.end !== st.start ? '-' + st.end : '') + (st.side === 'base' ? ' (base)' : '');

  const getFile = fetchFile;
  async function getDiff() {
    if (!S.diff) S.diff = api('GET', '/api/diff?base=' + encodeURIComponent(S.review.base) + '&head=' + encodeURIComponent(S.review.head));
    return S.diff;
  }

  /* ----- presenter <-> projector sync ----- */
  async function pushState() {
    if (!presenter || !S.review) return;
    try {
      const st = await api('PUT', '/api/state', { review_id: id, stop_index: S.i, mode: S.mode, peek: S.mode === 'peek' ? S.peek : null });
      setProjector(st.projector_age != null && st.projector_age < 3);
      checkReviewVersion(st);
    } catch (e) { setProjector(false); }
  }
  // Someone saved or flagged the review (maybe in another tab): reload it so notes and flags stay current.
  async function checkReviewVersion(st) {
    if (S.reviewVersion === undefined) { S.reviewVersion = st.review_version; return; }
    if (st.review_version === S.reviewVersion) return;
    S.reviewVersion = st.review_version;
    try {
      S.review = await api('GET', '/api/review/' + encodeURIComponent(id));
      S.i = Math.max(0, Math.min(stops().length - 1, S.i));
      renderHead(); renderNote(); renderStops();
    } catch (e) { /* keep what we have */ }
  }
  async function poll() {
    if (!S.review) return;
    let st;
    try { st = await api('GET', '/api/state?follow=1'); } catch (e) { setFollowing(false); return; }
    checkReviewVersion(st);
    const live = st.review_id === id && st.age != null && st.age < 6;
    setFollowing(live);
    if (!live) { S.lastApplied = ''; return; }
    const key = st.stop_index + ':' + st.mode + ':' + JSON.stringify(st.peek || null);
    if (key === S.lastApplied) return;
    S.lastApplied = key;
    S.mode = VIEW_MODES.includes(st.mode) ? st.mode : 'stop';
    S.peek = st.mode === 'peek' && st.peek ? st.peek : null;
    if (S.mode === 'peek' && !S.peek) S.mode = 'stop';
    go(st.stop_index, { keepMode: true, silent: true });
  }
  function setFollowing(on) {
    if (on === S.following) return;
    S.following = on;
    els.sync.textContent = on ? '● following presenter' : '○ standalone';
    els.sync.className = on ? 'live' : '';
  }
  function setProjector(on) {
    if (on === S.projector) return;
    S.projector = on;
    els.sync.textContent = on ? '● projector following' : '○ no projector yet';
    els.sync.className = on ? 'live' : '';
  }

  /* ----- rendering ----- */
  const lineEl = codeLine;

  async function renderCode() {
    const st = cur();
    const code = els.code;
    code.style.fontSize = S.font + 'px';
    code.classList.toggle('full', S.mode === 'full');
    if (!st) { code.innerHTML = ''; code.append(h('div', { class: 'empty-msg' }, 'This review has no stops yet.')); return; }
    const token = ++S.renderToken;
    let frag;
    try {
      if (S.mode === 'diff') frag = await renderDiffCode(st);
      else if (S.mode === 'peek' && S.peek) frag = fileView(await getFile(S.peek.file, S.review.head), S.peek.line, S.peek.line, { full: true });
      else if (S.mode === 'expand') frag = await renderExpandCode(st);
      else frag = await renderFileCode(st, S.mode === 'full');
    } catch (e) {
      frag = h('div', { class: 'error' }, e.message);
    }
    if (token !== S.renderToken) return;  // a newer render superseded this one
    code.innerHTML = '';
    code.append(frag);
    const first = code.querySelector('.ln.in');
    if ((S.mode === 'full' || S.mode === 'peek') && first) first.scrollIntoView({ block: 'center' });
    else code.scrollTop = 0;
    const next = stops()[S.i + 1];
    if (next) getFile(next.file, revFor(next)).catch(() => {});
  }

  async function renderFileCode(st, full) {
    return fileView(await getFile(st.file, revFor(st)), st.start, st.end, { full, context: CONTEXT });
  }

  // Preprocessed text for the stop's lines (C only), keyed by original line numbers.
  async function renderExpandCode(st) {
    els.code.innerHTML = '';
    els.code.append(h('div', { class: 'gap' }, 'preprocessing ' + st.file + '…'));
    const r = await api('GET', '/api/expand?file=' + encodeURIComponent(st.file) + '&start=' + st.start + '&end=' + st.end);
    const frag = document.createDocumentFragment();
    frag.append(h('div', { class: 'hunk' }, 'macros expanded with ' + r.target + "'s flags"));
    const html = hlLines(r.lines.map(l => l.text), 'c');
    r.lines.forEach((l, i) => frag.append(lineEl(l.line, html[i], 'in')));
    if (!r.lines.length) frag.append(h('div', { class: 'gap' }, 'Nothing left after preprocessing (all conditional-compiled out?).'));
    return frag;
  }

  // Click-to-definition: replace the code pane with the file at the definition until Esc.
  function peekAt(name, d) {
    S.peek = { file: d.file, line: d.line, name };
    setMode('peek');
  }

  async function renderDiffCode(st) {
    const files = await getDiff();
    const side = st.side || 'head';
    const f = files.find(x => (side === 'base' ? x.old_file : x.new_file) === st.file) || files.find(x => x.file === st.file);
    const frag = document.createDocumentFragment();
    if (!f) { frag.append(h('div', { class: 'gap' }, 'This file is not part of the diff.')); return frag; }
    const lang = langFor(f.file);
    let shown = 0;
    for (const hk of f.hunks) {
      const hs = side === 'base' ? hk.old_start : hk.new_start;
      const hl = side === 'base' ? hk.old_len : hk.new_len;
      if (hs + Math.max(hl, 1) - 1 < st.start - CONTEXT || hs > st.end + CONTEXT) continue;
      shown++;
      frag.append(h('div', { class: 'hunk' }, hunkLabel(hk)));
      let o = hk.old_start, n = hk.new_start, state = null;
      for (const l of hk.lines) {
        const tag = l[0];
        const x = hlLine(l.slice(1), lang, state); state = x.state;
        let no, cls;
        if (tag === '+') { no = n++; cls = 'add'; }
        else if (tag === '-') { no = o++; cls = 'del'; }
        else { no = side === 'base' ? o : n; o++; n++; cls = ''; }
        const mine = tag === ' ' || (tag === '+' && side === 'head') || (tag === '-' && side === 'base');
        const inRange = mine && no >= st.start && no <= st.end;
        frag.append(lineEl(no, x.html, cls + (inRange ? ' in' : ' dim'), tag === ' ' ? ' ' : tag));
      }
    }
    if (!shown) frag.append(h('div', { class: 'gap' }, 'No hunks in the diff overlap this stop.'));
    return frag;
  }

  function renderNote() {
    const st = cur();
    els.note.innerHTML = '';
    if (!st) return;
    els.note.append(h('div', null, h('span', { class: 'badge ' + (st.kind || 'change') }, st.kind || 'change')));
    if (st.note && st.note.trim()) els.note.append(h('div', { html: md(st.note) }));
    else els.note.append(h('p', { class: 'empty' }, 'No note for this stop.'));
    if (presenter) {
      els.note.append(h('div', { class: 'private' },
        h('h3', null, 'Presenter note ', h('span', { class: 'badge question' }, 'private')),
        st.presenter_note && st.presenter_note.trim() ? h('div', { html: md(st.presenter_note) }) : h('p', { class: 'empty' }, 'None.')));
      const next = stops()[S.i + 1];
      els.note.append(h('div', { class: 'upnext' },
        h('h3', null, 'Up next'),
        next ? h('div', null, h('span', { class: 'mono' }, (S.i + 2) + '. ' + locOf(next)), h('div', { class: 'muted' }, firstLine(next.note) || 'no note'))
             : h('div', { class: 'muted' }, 'This is the last stop.')));
    }
    if (st.flags && st.flags.length) {
      els.note.append(h('div', { class: 'flags' }, h('h3', null, 'Flags'), h('ul', null, st.flags.map(f => h('li', null, f.text, ' ', h('span', { class: 'muted' }, '— ' + f.by))))));
    }
  }

  function renderStops() {
    if (!presenter) return;
    els.stops.innerHTML = '';
    stops().forEach((st, i) => {
      els.stops.append(h('li', { class: i === S.i ? 'active' : '', onclick: () => go(i) },
        h('span', { class: 'grip' }, i === S.i ? '▸' : ''),
        h('div', null,
          h('div', { class: 'loc' }, h('span', { class: 'idx' }, (i + 1) + '.'), h('span', { class: 'badge ' + (st.kind || 'change') }, st.kind || 'change'),
            h('span', { class: 'f', title: st.file }, st.file.split('/').pop() + ':' + st.start + (st.end !== st.start ? '-' + st.end : '') + (st.flags && st.flags.length ? ' ⚑' : ''))),
          h('div', { class: 'note1' + (firstLine(st.note) ? '' : ' empty') }, firstLine(st.note) || 'no note'))));
    });
    const active = els.stops.querySelector('li.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function renderHead() {
    const st = cur();
    const total = stops().length;
    els.loc.textContent = S.mode === 'peek' && S.peek ? S.peek.file + ':' + S.peek.line : (st ? locOf(st) : '');
    els.pos.textContent = total ? 'stop ' + (S.i + 1) + ' / ' + total : 'no stops';
    els.modeEl.textContent = S.mode === 'full' ? 'FULL FILE · Esc returns'
      : S.mode === 'diff' ? 'DIFF · d returns'
      : S.mode === 'peek' ? 'DEFINITION OF ' + (S.peek ? S.peek.name : '') + ' · Esc returns'
      : S.mode === 'expand' ? 'MACROS EXPANDED · m returns'
      : (st ? (st.side === 'base' ? 'base' : 'head') : '');
  }

  function renderAll() { renderHead(); renderNote(); renderStops(); renderCode(); }

  function go(i, opts) {
    const total = stops().length;
    if (!total) return;
    S.i = Math.max(0, Math.min(total - 1, i));
    if (!(opts && opts.keepMode)) S.mode = 'stop';
    history.replaceState(null, '', '#' + (presenter ? 'present' : 'walk') + '/' + encodeURIComponent(id) + '/' + (S.i + 1));
    renderAll();
    if (!(opts && opts.silent)) pushState();
  }
  function setMode(mode) {
    S.mode = mode;
    if (mode !== 'peek') S.peek = null;
    renderHead(); renderCode();
    pushState();
  }

  function setFont(delta) {
    S.font = Math.max(10, Math.min(48, S.font + delta));
    localStorage.setItem('tour.font', String(S.font));
    els.code.style.fontSize = S.font + 'px';
  }

  /* ----- overlays: help, goto, flag ----- */
  function showHelp() {
    hideOverlays();
    S.help = true;
    const rows = [
      ['Space / → / j', 'next stop'], ['← / k', 'previous stop'], ['Home / End', 'first / last stop'],
      ['g then a number, Enter', 'jump to a stop'], ['f', 'open the full file at this point'],
      ['d', 'show the diff for this stop instead of the file'], ['m', 'expand macros for this stop (C)'],
      ['click a name', 'jump to its definition'], ['Esc', 'back to the current stop'],
      ['x', 'flag this stop for follow-up'], ['+ / -', 'font size'], ['t', 'dark / light theme'], ['?', 'this help'],
    ];
    document.body.append(h('div', { class: 'overlay', onclick: hideOverlays },
      h('div', { class: 'box' }, h('h2', null, presenter ? 'Presenter keys' : 'Keys'),
        h('table', null, rows.map(r => h('tr', null, h('td', null, h('kbd', null, r[0])), h('td', null, r[1])))),
        h('p', { class: 'muted', style: 'margin:12px 0 0' }, presenter
          ? 'The projector tab (#walk) follows this tab while it is open.'
          : 'Any key closes this.'))));
  }
  function hideOverlays() {
    S.help = false; S.goto = null; S.flag = null; S.chooser = false;
    document.querySelectorAll('.overlay, .goto').forEach(el => el.remove());
  }
  function paintGoto() {
    let el = document.querySelector('.goto');
    if (S.goto === null) { if (el) el.remove(); return; }
    if (!el) { el = h('div', { class: 'goto' }); document.body.append(el); }
    el.textContent = 'go to stop: ' + S.goto + '_   (Enter, Esc)';
  }
  function openFlag() {
    const st = cur();
    if (!st) return;
    hideOverlays();
    S.flag = '';
    const input = h('input', { type: 'text', placeholder: 'What needs following up?', style: 'width:100%;font-size:16px' });
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') submitFlag(input.value);
      else if (e.key === 'Escape') hideOverlays();
    });
